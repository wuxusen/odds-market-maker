[project]
name = "odds-market-maker"
version = "0.1.0"
description = "In-play odds market maker agent for TxODDS TxLINE data on Solana (paper trading)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # stdlib only, by design

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Only needed for on-chain audit anchoring (odds_mm.anchor.SolanaAnchor).
# The core agent (feeds/pricing/mm/ledger/dashboard) stays stdlib-only;
# anchoring degrades to a logged no-op if these aren't installed.
anchor = ["solana>=0.34", "solders>=0.21", "bip-utils>=2.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["odds_mm*"]
